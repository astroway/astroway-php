name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Packagist auto-mirrors GitHub releases via configured webhook
# (https://packagist.org/profile/edit). This workflow runs tests on tag push
# and creates the GitHub Release entry. Packagist picks up the new version
# from the tag automatically — no token needed.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Release ${TAG}. See CHANGELOG.md for details."
          fi
